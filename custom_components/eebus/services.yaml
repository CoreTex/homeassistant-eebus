set_consumption_limit:
  fields:
    value_w:
      required: true
      example: 4200
      selector:
        number:
          min: 0
          max: 100000
          step: 100
          unit_of_measurement: W
    active:
      required: false
      default: true
      selector:
        boolean:
    duration_s:
      required: false
      default: 0
      example: 3600
      selector:
        number:
          min: 0
          max: 86400
          step: 1
          unit_of_measurement: s

set_production_limit:
  fields:
    value_w:
      required: true
      example: 7000
      selector:
        number:
          min: 0
          max: 100000
          step: 100
          unit_of_measurement: W
    active:
      required: false
      default: true
      selector:
        boolean:
    duration_s:
      required: false
      default: 0
      example: 3600
      selector:
        number:
          min: 0
          max: 86400
          step: 1
          unit_of_measurement: s

trust_device:
  fields:
    ski:
      required: true
      example: "047f49440480912fbaa29cc6ac1d572ef7565413"
      selector:
        text:

forget_device:
  fields:
    ski:
      required: true
      example: "047f49440480912fbaa29cc6ac1d572ef7565413"
      selector:
        text:

set_device_limit:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: eebus
    ski:
      required: false
      example: "4ff37d1e374a006d0de80260256b82de3d745fa4"
      selector:
        text:
    kind:
      required: false
      default: consumption
      selector:
        select:
          options:
            - consumption
            - production
    value_w:
      required: false
      example: 4200
      selector:
        number:
          min: 0
          max: 100000
          step: 100
          unit_of_measurement: W
    active:
      required: false
      selector:
        boolean:
    duration_s:
      required: false
      example: 7200
      selector:
        number:
          min: 0
          max: 86400
          step: 60
          unit_of_measurement: s

simulate_grid_limit:
  fields:
    value_w:
      required: false
      default: 4200
      selector:
        number:
          min: 0
          max: 100000
          step: 100
          unit_of_measurement: W
    active:
      required: false
      default: true
      selector:
        boolean:
    duration_s:
      required: false
      default: 900
      selector:
        number:
          min: 0
          max: 86400
          step: 60
          unit_of_measurement: s
