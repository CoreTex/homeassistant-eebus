name: EEBUS Bridge
version: "0.6.0"
slug: eebus_bridge
description: >-
  EEBUS energy manager for Home Assistant: pair and monitor inverters,
  batteries, wallboxes, heat pumps and smart meters, receive §14a grid
  operator limits, share them by demand and control your devices. Use with
  the "EEBUS" integration from HACS.
url: https://github.com/CoreTex/homeassistant-eebus
# Pre-built multi-arch images published by GitHub Actions (.github/workflows/build.yml).
# With this set, the Supervisor pulls the image instead of compiling on-device.
# {arch} is substituted by the Supervisor (aarch64 / amd64).
image: "ghcr.io/coretex/{arch}-addon-eebus_bridge"
# EEBUS needs LAN access for SHIP/mDNS discovery and direct TLS connections.
host_network: true
init: false
startup: services
arch:
  - aarch64
  - amd64
# /data is provided automatically and holds the persisted certificate + key.
# Options are grouped by topic; names and help texts come from translations/.
options:
  # --- Devices & pairing ---
  inverter_ski: ""
  trusted_skis: []
  auto_accept_trust: false
  # --- Control (bridge as energy manager) ---
  enable_eg_control: false
  distribute_lpc: false
  distribute_lpc_inverters: false
  enable_lpc_simulation: false
  # --- Grid operator limits received by the bridge (§14a) ---
  enable_lpc: true
  enable_lpp: true
  auto_approve_limits: true
  lpc_nominal_max_w: 0
  lpp_nominal_max_w: 0
  # --- Monitoring ---
  enable_mpc: true
  enable_inverter: true
  enable_battery: true
  enable_mgcp: true
  enable_ev: true
  # --- Advanced ---
  device_brand: HomeAssistant
  device_model: EEBUS-Bridge
  device_serial: ""
  eebus_port: 4715
  api_port: 7050
  api_token: ""
  log_level: info
schema:
  inverter_ski: match(^[0-9a-fA-F]{40}$)?
  trusted_skis:
    - match(^[0-9a-fA-F]{40}$)
  auto_accept_trust: bool
  enable_eg_control: bool
  distribute_lpc: bool
  distribute_lpc_inverters: bool
  enable_lpc_simulation: bool
  enable_lpc: bool
  enable_lpp: bool
  auto_approve_limits: bool
  lpc_nominal_max_w: float(0,)
  lpp_nominal_max_w: float(0,)
  enable_mpc: bool
  enable_inverter: bool
  enable_battery: bool
  enable_mgcp: bool
  enable_ev: bool
  device_brand: str
  device_model: str
  device_serial: str?
  eebus_port: int(1,65535)
  api_port: int(1,65535)
  api_token: password?
  log_level: list(error|info|debug|trace)
